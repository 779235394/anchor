[package]
name = "anchor"
version = "0.9.5"
description = "Anchor — Local-First Personal Desktop Workbench for Tasks, Kanban, Scheduling & Quick Notes"
authors = ["Anchor"]
license-file = "../LICENSE"
publish = false
edition = "2021"

[lib]
name = "anchor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
getrandom = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSThread", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
