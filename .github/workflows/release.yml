name: Release macOS & Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Vitest unit tests
        run: pnpm test

      - name: Type-check & build frontend
        run: pnpm build

  release:
    name: Build & Publish (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS Universal
            args: '--target universal-apple-darwin --bundles dmg,app'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            sidecar_platform: 'macos-universal'
          - platform: windows-latest
            label: Windows x64
            args: '--bundles nsis,msi'
            rust_targets: ''
            sidecar_platform: 'windows-x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Prepare embedded cloudflared sidecar
        run: node scripts/prepare-cloudflared.mjs --platform=${{ matrix.sidecar_platform }}

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Extract version release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const ver = pkg.version;
            const changelog = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const lines = changelog.replace(/\r\n?/g, "\n").split("\n");
            const start = lines.findIndex((l) => l.startsWith("## [" + ver + "]"));
            let section = "";
            if (start !== -1) {
              let end = lines.findIndex((l, idx) => idx > start && l.startsWith("## ["));
              if (end === -1) end = lines.length;
              section = lines.slice(start + 1, end).join("\n").trim();
            }
            if (!section) {
              try {
                const log = cp.execSync("git log -n 15 --pretty=format:\"- %s\"", { encoding: "utf8" }).trim();
                section = "### 本次变更\n" + log;
              } catch {
                section = "版本 v" + ver + " 构建发布。";
              }
            }
            const body = [
              "## Anchor（锚点）v" + ver,
              "",
              section,
              "",
              "---",
              "### 安装器下载说明",
              "- **macOS（Apple Silicon + Intel 通用版）**：下载 `Anchor_" + ver + "_universal.dmg`，打开后拖入「应用程序」",
              "- **Windows（64 位）**：下载 `.exe`（NSIS 安装器）或 `.msi` 安装包直接运行安装"
            ].join("\n");
            const outPath = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(outPath, "body<<__ANCHOR_RELEASE_EOF__\n" + body + "\n__ANCHOR_RELEASE_EOF__\n");
          '

      - name: Build & Publish Release via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'Anchor v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Publish Draft Release (All Platforms Ready)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Release after macOS & Windows artifacts complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          gh release edit "$TAG" --draft=false
