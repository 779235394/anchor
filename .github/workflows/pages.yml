name: Deploy Official Website (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'src/services/demoBridge.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Website & Embedded Real App Sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root & website dependencies
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm --dir website install --frozen-lockfile || pnpm --dir website install

      - name: Type-check & build official website
        env:
          VITE_BASE_PATH: /anchor/
        run: pnpm --dir website build

      - name: Build embedded real desktop browser sandbox (/anchor/app/)
        env:
          VITE_BASE_PATH: /anchor/app/
          VITE_OUT_DIR: website/dist/app
        run: pnpm exec vite build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
